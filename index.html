<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird - Embedded Game</title>
  <style>
    /* Scope all styles within the outer container to prevent parent CSS leaks */
    .fb-game-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 100vh;
      background-color: #1a1a24;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Isolated canvas frame block */
    .fb-game-wrapper #game-container {
      position: relative;
      width: 360px;
      height: 640px;
      background-color: #70c5ce;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .fb-game-wrapper canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* UI Overlay Layers */
    .fb-game-wrapper .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #ffffff;
      transition: opacity 0.25s ease-in-out;
      pointer-events: none;
      box-sizing: border-box;
      padding: 20px;
    }

    .fb-game-wrapper .ui-layer.active {
      pointer-events: auto;
      opacity: 1;
    }

    .fb-game-wrapper .ui-layer.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Score Tracker UI */
    .fb-game-wrapper #score-display {
      position: absolute;
      top: 25px;
      font-size: 52px;
      font-weight: 900;
      text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      z-index: 5;
    }

    /* Screen Typography & Components */
    .fb-game-wrapper h1 {
      font-size: 38px;
      margin: 0 0 10px 0;
      text-shadow: 3px 3px 0 #000;
      letter-spacing: 1px;
    }

    .fb-game-wrapper p {
      font-size: 16px;
      margin: 0 0 25px 0;
      color: #e0e0e0;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      line-height: 1.4;
    }

    .fb-game-wrapper .card {
      background: rgba(0, 0, 0, 0.65);
      border-radius: 16px;
      padding: 25px 20px;
      width: 85%;
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .fb-game-wrapper .stats-box {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin: 15px 0 20px 0;
      display: flex;
      justify-content: space-around;
    }

    .fb-game-wrapper .stat-item {
      display: flex;
      flex-direction: column;
    }

    .fb-game-wrapper .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      color: #bbb;
      letter-spacing: 0.5px;
    }

    .fb-game-wrapper .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #f7d51d;
    }

    .fb-game-wrapper button {
      background: linear-[#e66e20];
      background-image: linear-gradient(to bottom, #f7a22d, #e66e20);
      border: none;
      border-bottom: 4px solid #b34e0c;
      color: white;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s ease, filter 0.1s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .fb-game-wrapper button:hover {
      filter: brightness(1.08);
    }

    .fb-game-wrapper button:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
  </style>
</head>
<body>

  <div class="fb-game-wrapper">
    <div id="game-container">
      <canvas id="gameCanvas" width="360" height="640"></canvas>
      
      <!-- Live Score HUD -->
      <div id="score-display">0</div>

      <!-- Start Overlay -->
      <div id="start-screen" class="ui-layer active">
        <div class="card">
          <h1>FLAPPY BIRD</h1>
          <p>Press <strong>Space</strong>, <strong>Click</strong>, or <strong>Tap</strong> to flap wings & clear obstacles.</p>
          <button id="start-btn">Play Game</button>
        </div>
      </div>

      <!-- Game Over Overlay -->
      <div id="gameover-screen" class="ui-layer hidden">
        <div class="card">
          <h1>GAME OVER</h1>
          <div class="stats-box">
            <div class="stat-item">
              <span class="stat-label">Score</span>
              <span id="final-score" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Best</span>
              <span id="best-score" class="stat-value">0</span>
            </div>
          </div>
          <button id="restart-btn">Try Again</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      // Configuration & Physics Engine Tuning
      const CONFIG = {
        width: 360,
        height: 640,
        gravity: 0.38,
        jumpImpulse: -6.8,
        maxVelocityY: 9,
        pipeSpeed: 2.2,
        pipeSpawnInterval: 100, // frames
        pipeGap: 140,
        pipeWidth: 56,
        groundHeight: 80
      };

      // Game States
      const STATE = { START: 0, PLAYING: 1, GAMEOVER: 2 };
      let currentState = STATE.START;

      // Canvas Context Setup
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      // UI Element References
      const startScreen = document.getElementById('start-screen');
      const gameOverScreen = document.getElementById('gameover-screen');
      const scoreDisplay = document.getElementById('score-display');
      const finalScoreEl = document.getElementById('final-score');
      const bestScoreEl = document.getElementById('best-score');
      const startBtn = document.getElementById('start-btn');
      const restartBtn = document.getElementById('restart-btn');

      // Runtime Variables
      let frames = 0;
      let score = 0;
      let highScore = parseInt(localStorage.getItem('fb_highscore') || '0', 10);
      let animationFrameId = null;

      // Game Objects
      const bird = {
        x: 70,
        y: 280,
        width: 34,
        height: 24,
        radius: 14,
        velocity: 0,
        rotation: 0,
        
        reset() {
          this.y = 280;
          this.velocity = 0;
          this.rotation = 0;
        },

        flap() {
          this.velocity = CONFIG.jumpImpulse;
        },

        update() {
          this.velocity += CONFIG.gravity;
          if (this.velocity > CONFIG.maxVelocityY) {
            this.velocity = CONFIG.maxVelocityY;
          }
          this.y += this.velocity;

          // Rotation modeling based on velocity
          if (this.velocity < 0) {
            this.rotation = Math.max(-0.4, this.rotation - 0.1);
          } else {
            this.rotation = Math.min(1.2, this.rotation + 0.06);
          }
        },

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);

          // Body (Yellow Circle)
          ctx.beginPath();
          ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#f7d51d';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#000';
          ctx.stroke();

          // Eye (White/Black)
          ctx.beginPath();
          ctx.arc(6, -4, 5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(7, -4, 2, 0, Math.PI * 2);
          ctx.fillStyle = '#000000';
          ctx.fill();

          // Beak (Orange Triangle)
          ctx.beginPath();
          ctx.moveTo(8, 2);
          ctx.lineTo(16, 5);
          ctx.lineTo(8, 9);
          ctx.closePath();
          ctx.fillStyle = '#e66e20';
          ctx.fill();
          ctx.stroke();

          // Wing (White/Light Yellow)
          ctx.beginPath();
          ctx.ellipse(-6, 2, 7, 4, 0.2, 0, Math.PI * 2);
          ctx.fillStyle = '#fff';
          ctx.fill();
          ctx.stroke();

          ctx.restore();
        }
      };

      const pipes = {
        items: [],

        reset() {
          this.items = [];
        },

        spawn() {
          // Dynamic calculation of safe bounds for pipe gap positions
          const minTop = 60;
          const maxTop = CONFIG.height - CONFIG.groundHeight - CONFIG.pipeGap - 60;
          const topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;

          this.items.push({
            x: CONFIG.width,
            top: topHeight,
            bottom: CONFIG.height - CONFIG.groundHeight - (topHeight + CONFIG.pipeGap),
            passed: false
          });
        },

        update() {
          if (frames % CONFIG.pipeSpawnInterval === 0) {
            this.spawn();
          }

          for (let i = 0; i < this.items.length; i++) {
            let p = this.items[i];
            p.x -= CONFIG.pipeSpeed;

            // Score check
            if (!p.passed && p.x + CONFIG.pipeWidth < bird.x) {
              p.passed = true;
              score++;
              scoreDisplay.innerText = score;
            }

            // Remove off-screen pipes
            if (p.x + CONFIG.pipeWidth < 0) {
              this.items.splice(i, 1);
              i--;
            }
          }
        },

        draw() {
          for (let p of this.items) {
            // Render Pipe Gradient/Color Setup
            ctx.fillStyle = '#73bf2e';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;

            // --- Top Pipe Body ---
            ctx.fillRect(p.x, 0, CONFIG.pipeWidth, p.top);
            ctx.strokeRect(p.x, 0, CONFIG.pipeWidth, p.top);

            // Top Pipe Cap
            ctx.fillRect(p.x - 3, p.top - 20, CONFIG.pipeWidth + 6, 20);
            ctx.strokeRect(p.x - 3, p.top - 20, CONFIG.pipeWidth + 6, 20);

            // --- Bottom Pipe Body ---
            const bottomY = CONFIG.height - CONFIG.groundHeight - p.bottom;
            ctx.fillRect(p.x, bottomY, CONFIG.pipeWidth, p.bottom);
            ctx.strokeRect(p.x, bottomY, CONFIG.pipeWidth, p.bottom);

            // Bottom Pipe Cap
            ctx.fillRect(p.x - 3, bottomY, CONFIG.pipeWidth + 6, 20);
            ctx.strokeRect(p.x - 3, bottomY, CONFIG.pipeWidth + 6, 20);
          }
        }
      };

      const environment = {
        clouds: [
          { x: 30, y: 120, scale: 0.8 },
          { x: 180, y: 80, scale: 1.2 },
          { x: 300, y: 150, scale: 0.6 }
        ],
        groundOffset: 0,

        update() {
          // Scroll ground texture in synced loop
          this.groundOffset = (this.groundOffset + CONFIG.pipeSpeed) % 20;
          
          // Scroll clouds gently
          for (let cloud of this.clouds) {
            cloud.x -= 0.5;
            if (cloud.x < -60) cloud.x = CONFIG.width + 60;
          }
        },

        draw() {
          // 1. City Skyline Backing
          ctx.fillStyle = '#4ec0ca';
          ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

          // Render Vector Clouds
          ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
          for (let cloud of this.clouds) {
            ctx.beginPath();
            ctx.arc(cloud.x, cloud.y, 20 * cloud.scale, 0, Math.PI * 2);
            ctx.arc(cloud.x + 15 * cloud.scale, cloud.y - 10 * cloud.scale, 15 * cloud.scale, 0, Math.PI * 2);
            ctx.arc(cloud.x + 30 * cloud.scale, cloud.y, 18 * cloud.scale, 0, Math.PI * 2);
            ctx.fill();
          }

          // Distant Building Shapes
          ctx.fillStyle = '#9ce6b9';
          ctx.fillRect(0, CONFIG.height - CONFIG.groundHeight - 40, CONFIG.width, 40);

          // 2. Foreground Ground
          const groundY = CONFIG.height - CONFIG.groundHeight;
          ctx.fillStyle = '#ded895';
          ctx.fillRect(0, groundY, CONFIG.width, CONFIG.groundHeight);

          // Top Grass Stripe
          ctx.fillStyle = '#73bf2e';
          ctx.fillRect(0, groundY, CONFIG.width, 14);

          // Ground Separator Border Line
          ctx.beginPath();
          ctx.moveTo(0, groundY);
          ctx.lineTo(CONFIG.width, groundY);
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#000';
          ctx.stroke();

          // Ground Pattern Lines
          ctx.strokeStyle = '#cbb86b';
          ctx.lineWidth = 3;
          for (let x = -this.groundOffset; x < CONFIG.width; x += 20) {
            ctx.beginPath();
            ctx.moveTo(x, groundY + 14);
            ctx.lineTo(x - 10, CONFIG.height);
            ctx.stroke();
          }
        }
      };

      // Collision Detection Engine
      function checkCollisions() {
        // Floor & Ceiling Boundaries
        const groundTop = CONFIG.height - CONFIG.groundHeight;
        if (bird.y + bird.radius >= groundTop) {
          bird.y = groundTop - bird.radius;
          return true;
        }
        if (bird.y - bird.radius <= 0) {
          return true;
        }

        // Pipe Collisions (Bounding Box against Circle center)
        for (let p of pipes.items) {
          const topPipeBottom = p.top;
          const bottomPipeTop = CONFIG.height - CONFIG.groundHeight - p.bottom;

          // Check if bird is within pipe's X-span
          if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + CONFIG.pipeWidth) {
            // Check collision with top pipe or bottom pipe
            if (bird.y - bird.radius < topPipeBottom || bird.y + bird.radius > bottomPipeTop) {
              return true;
            }
          }
        }
        return false;
      }

      // Action Handlers
      function handleAction(e) {
        if (e) {
          // Prevent scroll defaults on action triggers
          if (e.type === 'keydown' && e.code !== 'Space') return;
          if (e.cancelable) e.preventDefault();
        }

        if (currentState === STATE.START) {
          setGameState(STATE.PLAYING);
          bird.flap();
        } else if (currentState === STATE.PLAYING) {
          bird.flap();
        }
      }

      function setGameState(newState) {
        currentState = newState;

        if (newState === STATE.START) {
          bird.reset();
          pipes.reset();
          score = 0;
          scoreDisplay.innerText = score;
          scoreDisplay.style.display = 'none';
          startScreen.classList.remove('hidden');
          startScreen.classList.add('active');
          gameOverScreen.classList.remove('active');
          gameOverScreen.classList.add('hidden');
        } 
        else if (newState === STATE.PLAYING) {
          startScreen.classList.remove('active');
          startScreen.classList.add('hidden');
          gameOverScreen.classList.remove('active');
          gameOverScreen.classList.add('hidden');
          scoreDisplay.style.display = 'block';
        } 
        else if (newState === STATE.GAMEOVER) {
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('fb_highscore', highScore.toString());
          }
          finalScoreEl.innerText = score;
          bestScoreEl.innerText = highScore;

          scoreDisplay.style.display = 'none';
          gameOverScreen.classList.remove('hidden');
          gameOverScreen.classList.add('active');
        }
      }

      // Central Game Loop
      function loop() {
        frames++;

        // Render Background
        environment.update();
        environment.draw();

        if (currentState === STATE.PLAYING) {
          pipes.update();
          bird.update();

          if (checkCollisions()) {
            setGameState(STATE.GAMEOVER);
          }
        }

        // Always render entities
        pipes.draw();
        bird.draw();

        animationFrameId = requestAnimationFrame(loop);
      }

      // Global Input Listeners
      const gameContainer = document.getElementById('game-container');

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') handleAction(e);
      });

      // Mouse & Touch events bound explicitly to active container scope
      gameContainer.addEventListener('mousedown', (e) => {
        if (e.button === 0) handleAction(e);
      });

      gameContainer.addEventListener('touchstart', (e) => {
        handleAction(e);
      }, { passive: false });

      // Button Click Bindings
      startBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        setGameState(STATE.PLAYING);
        bird.flap();
      });

      restartBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        bird.reset();
        pipes.reset();
        score = 0;
        scoreDisplay.innerText = score;
        setGameState(STATE.PLAYING);
        bird.flap();
      });

      // Initialize
      setGameState(STATE.START);
      loop();
    })();
  </script>
</body>
</html>
